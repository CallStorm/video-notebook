<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>影知</title>
    <meta name="application-name" content="影知" />
    <meta name="apple-mobile-web-app-title" content="影知" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var skin = localStorage.getItem("vn-skin");
          if (skin !== "cloud" && skin !== "ink" && skin !== "sand" && skin !== "bamboo") {
            skin = "bamboo";
          }
          document.documentElement.setAttribute("data-skin", skin);
          var raw = localStorage.getItem("vn-dark");
          var dark;
          if (raw === "1" || raw === "true") dark = true;
          else if (raw === "0" || raw === "false") dark = false;
          else dark = skin === "ink";
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.setAttribute("data-skin", "bamboo");
        }
      })();
    </script>
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
