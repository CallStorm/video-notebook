[alembic]
script_location = alembic
prepend_sys_path = .
# SQLAlchemy URL 由 env.py 从 app.core.config 注入；这里留空就好。
sqlalchemy.url =

[post_write_hooks]
# 可以在此挂 black / ruff 钩子；v1 不启用。

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
